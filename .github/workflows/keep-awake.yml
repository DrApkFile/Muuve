name: Keep Render awake
# Render's free web services sleep after ~15 idle minutes, and the background worker runs
# inside the API service (RUN_WORKER=true), so it would sleep too. Ping the health check
# every 10 minutes. GitHub may delay scheduled runs by a few minutes under load.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        run: |
          # A cold start can take close to a minute; retry rather than fail on the first try.
          curl --fail --silent --show-error --max-time 90 \
            --retry 3 --retry-delay 10 --retry-all-errors \
            https://muuve.onrender.com/api/health
