name: Backend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@12.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: muuve_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: muuve_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://muuve_test:local-test-only@127.0.0.1:5432/muuve_test
      MUUVE_ALLOW_MIGRATIONS: "1"
      MUUVE_TEST_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@12.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm exec vitest run tests/db tests/api
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --manifest-path programs/muuve_escrow/Cargo.toml -- --test-threads=1
        env:
          CARGO_BUILD_JOBS: "2"
  sbf:
    runs-on: ubuntu-latest
    env:
      SBF_TOOLCHAIN_ROOT: ${{ github.workspace }}/.cache/platform-tools-v1.58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install --global pnpm@12.15.0
      - run: pnpm install --frozen-lockfile
      - run: python3 scripts/install-sbf-tools.py
      - run: pnpm build:sbf --fixture
      - run: pnpm test:sbf
